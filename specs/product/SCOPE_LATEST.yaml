feature: GraDule v1
core_value: >-
  Студент ЮФУ видит расписание
  и баллы БРС офлайн в одном приложении.
summary: >-
  GraDule v1 — Android (Kotlin + Compose):
  расписание ИММиКН и баллы БРС.
  Offline-first: Room — источник истины.
  Срезы W0-W10 из handoff B11,
  решения D1-D7 закрыты.
  Разведка W0 даёт фикстуры до кода.
in_scope:
  - "e00: разведка — фикстуры БРС, Rate, грамматика timeslot, стабильность id"
  - "e01: каркас — тема, гибридная навигация, онбординг без входа, ссылка БРС"
  - "e02: расписание — ядро (парсер, дата) + выбор группы и экран дня"
  - "e03: баллы — семестры, дисциплины с Rate, детали, лента"
  - "e04: свои записи — LOCAL + оверрайды (b), заметки, архив по семестрам"
  - "e05: обмен — экспорт ALL + сервер + импорт снапшотом"
  - "e06: фон — опрос, уведомления"
  - "e07: виджет + PDF"
out_of_scope:
  - "FCM-сервер и чужие токены: хватает опроса (deferred)"
  - "Вариант (c) SERVER_EDITED с диффом: выбран (b) (deferred)"
  - "Мульти-аккаунт: один на устройство (not valuable)"
  - "Посещаемость: journal ни к чему не подключён (deferred)"
  - "Погода и приветствие: идея без проработки (not valuable для v1)"
constraints:
  - "Kotlin + Compose, single-module :app, offline-first"
  - "schedule-API: текущий семестр, шаблон без дат; group-id нестабильны"
  - "БРС-разведка ждёт токен пользователя (R1, R2)"
  - "Без сроков; готовность = runnable verify"
success_criteria:
  - "Экран дня показывает группу офлайн"
  - "Дисциплины с Rate офлайн, скрытия переживают синк"
  - "Своя запись переживает синк; заметка на дате вхождения"
  - "Импорт воспроизводит расписание; чужой id не перебирается"
  - "Уведомление при изменении балла, без повторов"
references:
  - "Handoff Downloads/GraDule_handoff.md (A факты, B рекомендации)"
  - "specs/tech-architecture/tech-stack.md"
key_decisions:
  - "gradule-nav: гибрид — bottom 3 + drawer"
  - "gradule-onboarding: расписание без входа"
  - "gradule-overrides: правки v1 — (b), отдельная таблица"
  - "gradule-notify: poll, без FCM-сервера"
  - "gradule-semester-scope: scope по семестрам, архив виден, новый чистый"
  - "gradule-export-all: экспорт всё (WEEKLY + ONE_OFF, FULL)"
  - "gradule-server-todo: сервер не развёрнут, W7 включает сервер"
  - "gradule-pdf-week: PDF — неделя"
